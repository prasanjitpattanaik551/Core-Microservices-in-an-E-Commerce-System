server.port=9090

spring.application.name=api-gateway

spring.profiles.active=local
  
  # E-commerce Service routes
spring.cloud.gateway.routes[0].id=ecommerce-products
spring.cloud.gateway.routes[0].uri=lb://ECOMMERCE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=ecommerce-orders
spring.cloud.gateway.routes[1].uri=lb://ECOMMERCE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=ecommerce-users
spring.cloud.gateway.routes[2].uri=lb://ECOMMERCE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
  
  # Payment Service routes
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payment/**
  
  # Default filters & Global CORS
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
  
  # Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
  
  # Actuator Management
management.endpoints.web.exposure.include=health,info,gateway


jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000